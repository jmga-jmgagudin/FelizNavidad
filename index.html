<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#071b24">
  <title>Una Navidad para recordar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Italianno&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Unica+One&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#09232d; --paper:#fffaf0; --gold:#d7b56d; --red:#a83239; --wine:#671d2a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; overflow:hidden; color:#f9f4e9; font-family:"DM Sans",sans-serif; background:#061923; }
    .night { position:relative; display:grid; min-height:100svh; place-items:center; isolation:isolate; overflow:hidden; background:radial-gradient(ellipse at 52% 26%,#17485a 0%,#0b2c3a 28%,#061923 70%); }
    .night::before { content:""; position:absolute; inset:0; opacity:.48; background:linear-gradient(115deg,transparent 0 45%,rgba(255,255,255,.035) 46%,transparent 48% 100%),radial-gradient(ellipse at 50% 125%,#031016 20%,transparent 67%); }
    .aurora { position:absolute; width:110vmax; height:50vmax; top:-30vmax; left:-25vmax; border-radius:50%; opacity:.28; filter:blur(35px); background:conic-gradient(from 230deg at 50% 100%,transparent,#21606a,transparent 36%,#436448,transparent 55%); transform:rotate(-12deg); animation:drift 16s ease-in-out infinite alternate; }
    .snow { position:absolute; inset:0; pointer-events:none; z-index:-1; }
    .flake { position:absolute; top:-10vh; width:var(--s); height:var(--s); border-radius:50%; background:white; opacity:var(--o); filter:blur(var(--b)); animation:fall var(--d) linear var(--delay) infinite; }
    .intro { position:absolute; top:clamp(22px,6vh,64px); text-align:center; letter-spacing:.16em; text-transform:uppercase; font-size:10px; font-weight:600; color:rgba(255,250,240,.63); }
    .intro span { display:block; margin-top:9px; font-family:"Playfair Display",serif; text-transform:none; letter-spacing:.02em; color:#fffaf0; font-size:clamp(19px,3vw,27px); font-style:italic; font-weight:500; }
    .stage { position:relative; width:min(100vw,560px); aspect-ratio:1.43; margin-top:40px; perspective:1200px; cursor:pointer; filter:drop-shadow(0 32px 28px rgba(0,0,0,.4)); }
    .stage:focus-visible { outline:2px solid var(--gold); outline-offset:12px; border-radius:5px; }
    .envelope { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .8s cubic-bezier(.22,.75,.15,1); }
    .stage.open .envelope { transform:translateY(78px) scale(.92); }
    .back { position:absolute; inset:0; border-radius:5px; background:linear-gradient(135deg,#a83239,#611525 72%); box-shadow:inset 0 0 0 1px rgba(255,231,192,.26),inset 0 -22px 32px rgba(51,6,15,.3); }
    .back::after { content:""; position:absolute; inset:8px; border:1px solid rgba(224,188,105,.23); border-radius:2px; }
    .card { position:absolute; z-index:2; left:7%; right:7%; bottom:9px; height:86%; padding:clamp(24px,6vw,36px) 24px; display:flex; flex-direction:column; justify-content:center; align-items:center; overflow:hidden; text-align:center; color:#836020; border:1px solid #e5d5b7; border-radius:3px; background:radial-gradient(circle at 15% 0,#fffdf6,#f8eedb 80%); box-shadow:0 8px 22px rgba(0,0,0,.22); opacity:0; transform:translateY(34px); transition:transform 1s cubic-bezier(.16,.9,.2,1.18),opacity .35s ease; }
    .card::before { content:""; position:absolute; inset:9px; border:1px solid rgba(174,126,54,.6); border-radius:1px; pointer-events:none; }
    .card::after { content:"✦"; position:absolute; top:17px; color:#b78a41; font-size:13px; }
    .stage.open .card { z-index:9; opacity:1; transform:translateY(-112px) rotate(-1.5deg); box-shadow:0 18px 36px rgba(0,0,0,.3); }
    .card .eyebrow { margin:0 0 9px; color:#a77934; font-family:"Unica One",sans-serif; font-size:9px; letter-spacing:.22em; text-transform:uppercase; }
    h1 { margin:0; font:400 clamp(52px,14vw,78px)/.72 "Italianno",cursive; color:#b28a37; text-shadow:0 1px 0 #fff4cf,0 2px 4px rgba(104,62,7,.12); }
    .ornament { display:flex; align-items:center; gap:9px; width:135px; margin:18px 0 14px; color:#c49b55; font-size:11px; }
    .ornament::before,.ornament::after { content:""; height:1px; flex:1; background:currentColor; opacity:.7; }
    .message { max-width:260px; margin:0; color:#7e632d; font:italic 500 clamp(15px,3.8vw,18px)/1.42 "Playfair Display",serif; }
    .signature { margin:17px 0 0; color:#a77c2c; font:400 30px "Italianno",cursive; }
    .shooting-star { position:absolute; z-index:2; top:40%; left:-28%; width:15px; height:15px; opacity:0; border-radius:50%; background:#fff8d7; box-shadow:0 0 8px 3px #f3d27b,0 0 20px 7px rgba(209,160,62,.48); pointer-events:none; }
    .shooting-star::before { content:""; position:absolute; right:9px; top:6px; width:120px; height:2px; transform:rotate(8deg); transform-origin:right; background:linear-gradient(90deg,transparent,rgba(218,171,71,.12),#e7bd61); box-shadow:0 0 5px rgba(226,177,73,.72); }
    .stage.open .shooting-star { animation:shootAcross 1.35s cubic-bezier(.22,.61,.36,1) 1.15s forwards; }
    .front { position:absolute; z-index:5; inset:auto 0 0; height:68%; clip-path:polygon(0 0,50% 57%,100% 0,100% 100%,0 100%); border-radius:0 0 5px 5px; background:linear-gradient(145deg,#c44147,#751827 85%); box-shadow:inset 0 1px rgba(255,223,181,.28); }
    .front::after { content:""; position:absolute; inset:0; opacity:.3; background:linear-gradient(135deg,transparent 48%,rgba(50,0,9,.4) 49%,transparent 50%); }
    .flap { position:absolute; z-index:6; top:0; width:100%; height:62%; clip-path:polygon(0 0,100% 0,50% 100%); transform-origin:top; border-radius:5px 5px 0 0; background:linear-gradient(165deg,#c7464c,#7b1728); transition:transform .8s cubic-bezier(.22,.7,.18,1),z-index .01s linear .4s; backface-visibility:visible; }
    .stage.open .flap { z-index:1; transform:rotateX(180deg); }
    .seal { position:absolute; z-index:8; top:50%; left:50%; width:62px; height:62px; display:grid; place-items:center; border:2px solid #f5d98e; border-radius:50%; color:#6a211e; background:radial-gradient(circle at 35% 27%,#fff0b0 0 5%,#dfba62 31%,#b47a26 68%,#77470f); box-shadow:0 4px 10px rgba(39,5,10,.48),inset 0 0 0 3px rgba(111,66,10,.46),inset 0 1px 1px #fff5c2; transform:translate(-50%,-50%); transition:opacity .25s ease,transform .55s cubic-bezier(.5,-.5,.5,1.5); }
    .seal::before { content:"✦"; width:39px; height:39px; display:grid; place-items:center; border:1px solid rgba(97,51,5,.58); border-radius:50%; font:22px "Playfair Display",serif; text-shadow:0 1px #f5dea0; }
    .stage.open .seal { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(180deg); }
    .hint { position:absolute; bottom:clamp(25px,6vh,55px); display:flex; gap:9px; align-items:center; font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,250,240,.75); transition:opacity .2s; }
    .hint .dot { width:6px; height:6px; background:var(--gold); border-radius:50%; box-shadow:0 0 0 0 rgba(215,181,109,.6); animation:pulse 1.8s infinite; }
    .stage.open ~ .hint { opacity:0; pointer-events:none; }
    .close { position:absolute; z-index:10; bottom:clamp(17px,4vh,38px); padding:10px 16px; border:1px solid rgba(215,181,109,.55); border-radius:100px; background:rgba(5,20,27,.35); color:#f8e7be; font:600 10px/1 "DM Sans",sans-serif; letter-spacing:.14em; text-transform:uppercase; opacity:0; pointer-events:none; cursor:pointer; transition:opacity .4s,background .2s; backdrop-filter:blur(6px); }
    .close:hover { background:rgba(215,181,109,.18); }
    .stage.open ~ .close { opacity:1; pointer-events:auto; }
    @keyframes fall { to { transform:translate3d(var(--x),115vh,0) rotate(240deg); } }
    @keyframes drift { to { transform:translate(6vw,5vh) rotate(3deg); } }
    @keyframes pulse { 70% { box-shadow:0 0 0 9px rgba(215,181,109,0); } 100% { box-shadow:0 0 0 0 rgba(215,181,109,0); } }
    @keyframes shootAcross { 0% { opacity:0; transform:translate(0,30px) scale(.45); } 8% { opacity:1; } 76% { opacity:1; } 100% { opacity:0; transform:translate(520px,-115px) scale(.8); } }

    @media (max-width:600px) and (min-height:601px) {
      .stage { width:100vw; margin-top:52px; }
      .stage.open .envelope { transform:translateY(20svh) scale(.92); }
      .card { height:70svh; }
      .stage.open .card { transform:translateY(6svh) rotate(-1.5deg); }
      .card .message { max-width:290px; }
    }

    @media (max-height:600px) {
      .intro { top:15px; }
      .stage { width:min(100vw,460px); margin-top:20px; }
      .hint,.close { bottom:13px; }
    }

    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; }
    }
  </style>
</head>
<body>
  <audio id="christmasMusic" preload="auto">
    <source src="pieza1.mp3" type="audio/mpeg">
  </audio>

  <main class="night">
    <div class="aurora" aria-hidden="true"></div>
    <div class="snow" aria-hidden="true"></div>

    <div class="intro">
      Invierno 2026
      <span>Hay momentos que merecen ser celebrados</span>
    </div>

    <div class="stage" id="stage" role="button" tabindex="0" aria-label="Abrir felicitación navideña">
      <div class="envelope">
        <div class="back"></div>
        <div class="flap"></div>
        <div class="front"></div>
        <div class="seal" aria-hidden="true"></div>
      </div>

      <article class="card" aria-live="polite">
        <p class="eyebrow">Con todo nuestro cariño</p>
        <h1>Feliz<br>Navidad</h1>
        <div class="ornament">✦</div>
        <p class="message">Que la luz de estas fiestas acompañe tus días y que el nuevo año llegue lleno de instantes bellos por compartir.</p>
        <p class="signature">Con cariño</p>
        <i class="shooting-star" aria-hidden="true"></i>
      </article>
    </div>

    <div class="hint"><i class="dot"></i> Abre tu felicitación</div>
    <button class="close" id="close" type="button">Cerrar el sobre</button>
  </main>

  <script>
    const stage = document.querySelector('#stage');
    const close = document.querySelector('#close');
    const music = document.querySelector('#christmasMusic');

    const toggle = (open) => {
      stage.classList.toggle('open', open);
      stage.setAttribute('aria-label', open ? 'Felicitación abierta' : 'Abrir felicitación navideña');

      if (open) {
        music.currentTime = 0;
        music.play().catch(() => {});
      } else {
        music.pause();
        music.currentTime = 0;
      }
    };

    stage.addEventListener('click', () => toggle(true));

    stage.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggle(true);
      }
    });

    close.addEventListener('click', () => toggle(false));

    const snow = document.querySelector('.snow');

    for (let i = 0; i < 55; i++) {
      const flake = document.createElement('i');
      flake.className = 'flake';
      flake.style.cssText = `
        left:${Math.random() * 100}%;
        --s:${1 + Math.random() * 4}px;
        --o:${.22 + Math.random() * .7};
        --b:${Math.random() * .8}px;
        --d:${7 + Math.random() * 11}s;
        --delay:-${Math.random() * 16}s;
        --x:${-80 + Math.random() * 160}px
      `;
      snow.appendChild(flake);
    }
  </script>
</body>
</html>
